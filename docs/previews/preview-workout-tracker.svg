    <g transform="translate(26, 686)">
      <rect x="0" y="0" width="338" height="62" rx="16" fill="#24272B" stroke="#282B30" stroke-width="1" />
      <text x="16" y="24" fill="#8A918E" font-size="10.5" font-weight="500">Pause läuft</text>
      <text x="16" y="45" fill="#A8DAB5" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600">01:12.40</text>

      <rect x="174" y="16" width="54" height="30" rx="8" fill="#1C1E21" stroke="#282B30" stroke-width="1" />
      <text x="201" y="35" fill="#F2F4F3" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" text-anchor="middle">+30s</text>

      <rect x="234" y="16" width="90" height="30" rx="8" fill="#A8DAB5" />
      <text x="279" y="35" fill="#111214" font-size="11.5" font-weight="600" text-anchor="middle">Überspringen</text>
