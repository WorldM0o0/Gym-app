    <g transform="translate(26, 608)">
      <rect x="0" y="0" width="338" height="64" rx="16" fill="#1C1E21" />
      <text x="16" y="27" fill="#F2F4F3" font-size="15" font-weight="600">Klimmzüge (breiter Griff)</text>
      <text x="16" y="46" fill="#8A918E" font-size="11.5">Ziel: 3 × 6–8 Wdh.</text>
      <circle cx="256" cy="32" r="4" fill="#282B30" />
      <circle cx="268" cy="32" r="4" fill="#282B30" />
      <circle cx="280" cy="32" r="4" fill="#282B30" />
      <text x="292" y="36" fill="#8A918E" font-family="'JetBrains Mono', monospace" font-size="11.5">0/3</text>
      <polyline points="316,30 321,35 326,30" fill="none" stroke="#8A918E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

