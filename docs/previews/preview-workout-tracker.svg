<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" fill="none">
  <defs>
    <clipPath id="screen-clip-workout">
      <rect x="10" y="10" width="370" height="824" rx="44" />
    </clipPath>
  </defs>

  <!-- Outer Device Frame -->
  <rect x="4" y="4" width="382" height="836" rx="50" fill="#181A1D" stroke="#282B30" stroke-width="2" />
  <!-- App Surface (--color-surface: #111214) -->
  <rect x="10" y="10" width="370" height="824" rx="44" fill="#111214" />

  <g clip-path="url(#screen-clip-workout)" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- iOS Status Bar & Dynamic Island -->
    <text x="42" y="36" fill="#F2F4F3" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">09:41</text>
    <rect x="138" y="20" width="114" height="24" rx="12" fill="#000000" />
    <circle cx="236" cy="32" r="4.5" fill="#131824" />
    <g transform="translate(312, 26)" fill="#F2F4F3">
      <rect x="0" y="6" width="3" height="5" rx="1" />
      <rect x="4.5" y="4" width="3" height="7" rx="1" />
      <rect x="9" y="2" width="3" height="9" rx="1" />
      <rect x="13.5" y="0" width="3" height="11" rx="1" />
      <rect x="21" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#F2F4F3" stroke-width="1.2" />
      <rect x="23" y="3" width="14" height="6" rx="1" fill="#A8DAB5" />
    </g>

    <!-- 1. WORKOUT HEADER (wT in index-DjUS4W3P.js) -->
    <g transform="translate(26, 62)">
      <text x="0" y="20" fill="#F2F4F3" font-size="20" font-weight="600" letter-spacing="-0.3">Oberkörper A</text>
      <text x="0" y="38" fill="#8A918E" font-family="'JetBrains Mono', monospace" font-size="11.5">Dauer 34:18 · 2 von 9 Sätzen</text>

      <!-- Abbrechen & Fertig Buttons -->
      <rect x="178" y="4" width="82" height="36" rx="10" fill="none" stroke="#282B30" stroke-width="1" />
      <text x="219" y="26" fill="#F2F4F3" font-size="12" font-weight="500" text-anchor="middle">Abbrechen</text>

      <rect x="266" y="4" width="72" height="36" rx="10" fill="#A8DAB5" />
      <text x="302" y="26" fill="#111214" font-size="12.5" font-weight="600" text-anchor="middle">Fertig</text>
    </g>

    <!-- 2. ACTIVE EXERCISE CARD (ST / Gb in index-DjUS4W3P.js) -->
    <g transform="translate(26, 114)">
      <rect x="0" y="0" width="338" height="482" rx="16" fill="#1C1E21" />

      <!-- Exercise Title + Set Dots + Counter -->
      <text x="16" y="28" fill="#F2F4F3" font-size="16" font-weight="600">Bankdrücken (Langhantel)</text>
      <text x="16" y="46" fill="#8A918E" font-size="11.5">Ziel: 3 × 8–10 Wdh.</text>

      <!-- Set Progress Dots (2 completed in #A8DAB5, 1 remaining) + 2/3 -->
      <circle cx="256" cy="24" r="4" fill="#A8DAB5" />
      <circle cx="268" cy="24" r="4" fill="#A8DAB5" />
      <circle cx="280" cy="24" r="4" fill="#282B30" />
      <text x="292" y="28" fill="#8A918E" font-family="'JetBrains Mono', monospace" font-size="11.5">2/3</text>
      <polyline points="316,26 321,21 326,26" fill="none" stroke="#8A918E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Sub-row: ⇄ Ersetzen + Pause Stepper -->
      <rect x="16" y="58" width="84" height="26" rx="7" fill="none" stroke="#282B30" stroke-width="1" />
      <text x="58" y="75" fill="#8A918E" font-size="11" text-anchor="middle">⇄ Ersetzen</text>

      <text x="208" y="75" fill="#8A918E" font-size="11">Pause</text>
      <rect x="244" y="58" width="24" height="26" rx="6" fill="none" stroke="#282B30" stroke-width="1" />
      <text x="256" y="75" fill="#8A918E" font-size="13" text-anchor="middle">−</text>
      <text x="284" y="75" fill="#F2F4F3" font-family="'JetBrains Mono', monospace" font-size="11.5" text-anchor="middle">02:00</text>
      <rect x="300" y="58" width="24" height="26" rx="6" fill="none" stroke="#282B30" stroke-width="1" />
      <text x="312" y="75" fill="#8A918E" font-size="13" text-anchor="middle">+</text>

      <!-- Last Session & Progressive Overload Suggestion Box -->
      <rect x="16" y="94" width="306" height="48" rx="12" fill="#24272B" />
      <text x="28" y="113" fill="#8A918E" font-size="11">Letztes Mal: <tspan fill="#F2F4F3" font-family="'JetBrains Mono', monospace">80 kg × 10</tspan> (RIR 2)</text>
      <text x="28" y="131" fill="#A8DAB5" font-size="11" font-weight="600">📈 Vorschlag: <tspan font-family="'JetBrains Mono', monospace">82,5 kg × 8–10 Wdh.</tspan> (+2,5 kg)</text>

