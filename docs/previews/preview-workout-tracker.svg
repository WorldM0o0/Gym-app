      <g transform="translate(16, 154)">
        <rect x="0" y="0" width="68" height="28" rx="8" fill="#24272B" />
        <text x="34" y="18" fill="#8A918E" font-size="11" font-weight="500" text-anchor="middle">Warm-up</text>

        <rect x="74" y="0" width="84" height="28" rx="8" fill="#A8DAB5" />
        <text x="116" y="18" fill="#111214" font-size="11" font-weight="600" text-anchor="middle">Normalsatz</text>

        <rect x="164" y="0" width="68" height="28" rx="8" fill="#24272B" />
        <text x="198" y="18" fill="#8A918E" font-size="11" font-weight="500" text-anchor="middle">Superset</text>

        <rect x="238" y="0" width="68" height="28" rx="8" fill="#24272B" />
        <text x="272" y="18" fill="#8A918E" font-size="11" font-weight="500" text-anchor="middle">Dropset</text>
      </g>

