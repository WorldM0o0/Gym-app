        <line x1="42" y1="60" x2="104" y2="60" stroke="#A8DAB5" stroke-width="2" />
        <text x="73" y="48" fill="#F2F4F3" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="600" text-anchor="middle">82,5</text>

        <rect x="110" y="20" width="36" height="42" rx="10" fill="#24272B" />
        <text x="128" y="46" fill="#F2F4F3" font-size="18" text-anchor="middle">+</text>

        <!-- Reps Column -->
        <text x="160" y="12" fill="#8A918E" font-size="9.5" font-weight="600" letter-spacing="0.6">WIEDERHOLUNGEN</text>
        <rect x="160" y="20" width="36" height="42" rx="10" fill="#24272B" />
        <text x="178" y="46" fill="#F2F4F3" font-size="18" text-anchor="middle">−</text>

        <rect x="202" y="20" width="62" height="42" fill="none" />
        <line x1="202" y1="60" x2="264" y2="60" stroke="#282B30" stroke-width="2" />
        <text x="233" y="48" fill="#F2F4F3" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="600" text-anchor="middle">9</text>

        <rect x="270" y="20" width="36" height="42" rx="10" fill="#24272B" />
        <text x="288" y="46" fill="#F2F4F3" font-size="18" text-anchor="middle">+</text>
