    <!-- 5. FLOATING CAPSULE BOTTOM NAVIGATION (.capsule-nav: "Heute" active) -->
    <g transform="translate(65, 764)">
      <rect x="0" y="0" width="260" height="54" rx="27" fill="#1C1E21" stroke="#282B30" stroke-width="1" />

      <!-- Active Tab: Heute -->
      <rect x="6" y="6" width="98" height="42" rx="21" fill="#A8DAB5" />
      <g transform="translate(22, 19)" stroke="#111214" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="8" x2="14" y2="8" />
        <rect x="0" y="4" width="2.5" height="8" rx="1" fill="#111214" />
        <rect x="13.5" y="4" width="2.5" height="8" rx="1" fill="#111214" />
      </g>
      <text x="46" y="31" fill="#111214" font-size="13" font-weight="600">Heute</text>

      <!-- Inactive Tab 2: Verlauf -->
      <g transform="translate(122, 18)" stroke="#8A918E" stroke-width="1.8" stroke-linecap="round" fill="none">
        <circle cx="9" cy="10" r="7" />
        <polyline points="9 6.5 9 10 11.5 11.5" />
        <line x1="7" y1="1" x2="11" y2="1" />
      </g>

      <!-- Inactive Tab 3: Ernährung -->
      <g transform="translate(168, 18)" stroke="#8A918E" stroke-width="1.8" stroke-linecap="round" fill="none">
        <path d="M4 2v6a2 2 0 0 0 4 0V2" />
        <line x1="6" y1="2" x2="6" y2="16" />
        <path d="M13 2c0 4 2 4 2 7v7" />
        <line x1="13" y1="2" x2="13" y2="16" />
      </g>

      <!-- Inactive Tab 4: Einstellungen -->
      <g transform="translate(214, 18)" stroke="#8A918E" stroke-width="1.8" stroke-linecap="round" fill="none">
        <line x1="2" y1="4" x2="16" y2="4" />
        <line x1="2" y1="9" x2="16" y2="9" />
        <line x1="2" y1="14" x2="16" y2="14" />
        <circle cx="6" cy="4" r="2" fill="#1C1E21" />
        <circle cx="12" cy="9" r="2" fill="#1C1E21" />
        <circle cx="8" cy="14" r="2" fill="#1C1E21" />
      </g>
    </g>
