          <text x="90" y="19" fill="#8A918E" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">1</text>

          <rect x="124" y="0" width="56" height="30" rx="8" fill="#A8DAB5" />
          <text x="152" y="19" fill="#111214" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">2</text>

          <rect x="186" y="0" width="56" height="30" rx="8" fill="#24272B" />
          <text x="214" y="19" fill="#8A918E" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">3</text>

          <rect x="248" y="0" width="58" height="30" rx="8" fill="#24272B" />
          <text x="277" y="19" fill="#8A918E" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">4+</text>
