      <g transform="translate(16, 412)" font-family="'JetBrains Mono', monospace" font-size="11">
        <rect x="0" y="0" width="128" height="26" rx="13" fill="#24272B" />
        <text x="64" y="17" fill="#8A918E" text-anchor="middle">W1 · 60 kg × 10</text>

        <rect x="134" y="0" width="172" height="26" rx="13" fill="#213829" stroke="#A8DAB5" stroke-opacity="0.4" stroke-width="1" />
        <text x="220" y="17" fill="#D4F2DC" font-weight="600" text-anchor="middle">1 · 82,5 kg × 10 · RIR 1,5 🏆</text>

        <rect x="0" y="32" width="154" height="26" rx="13" fill="#24272B" />
        <text x="77" y="49" fill="#F2F4F3" text-anchor="middle">2 · 82,5 kg × 9 · RIR 2</text>
